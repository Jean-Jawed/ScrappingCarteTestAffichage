<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Événements - Marseille</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
    <header class="main-header">
        <div class="container nav-wrapper">
            <a href="index.html" class="logo">
                EventMarseille
            </a>
            <nav class="nav-links">
                <a href="map.html" class="nav-link">Carte</a>
                <a href="list.html" class="nav-link active">Liste</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="filters-wrapper" id="filters-wrapper">
            <button class="collapse-btn" id="collapse-btn" title="Réduire/Agrandir">-</button>
            <div class="filters-content">
                <div class="search-bar">
                    <div class="search-container" style="max-width:600px; margin:0 auto;">
                        <input type="text" id="tag-search" class="search-input"
                            placeholder="Rechercher un événement, lieu, tag...">
                        <div id="autocomplete-list" class="autocomplete-suggestions"></div>
                        <div id="active-search-tags" class="search-tag-container"></div>
                    </div>
                </div>

                <div class="map-filters"
                    style="position: static; transform: none; margin-bottom: 2rem; box-shadow: none; background: transparent; display:flex; flex-direction:column; align-items:center;">
                    <div class="filter-row">
                        <button class="filter-btn active" data-period="all">Tous</button>
                        <button class="filter-btn" data-period="today">Aujourd'hui</button>
                        <button class="filter-btn" data-period="tomorrow">Demain</button>
                        <button class="filter-btn" data-period="week">Cette semaine</button>
                        <button class="filter-btn" data-period="month" id="btn-month">Ce mois</button>
                        <button class="filter-btn" data-period="next_month" id="btn-next-month">Mois prochain</button>
                        <button class="filter-btn" data-period="custom" id="btn-custom">Dates personnalisées</button>
                    </div>

                    <div class="filter-row secondary-filters" style="justify-content: center;">
                        <div class="date-range-picker" id="date-picker-wrapper"
                            style="opacity: 0.5; pointer-events: none; background:white; border:1px solid #e2e8f0;">
                            <input type="date" id="date-start" class="date-input">
                            <span class="separator">à</span>
                            <input type="date" id="date-end" class="date-input">
                        </div>

                        <label class="toggle-switch" title="Inclure les événements passés">
                            <input type="checkbox" id="toggle-past">
                            <span class="slider"></span>
                            <span class="label-text">Inclure passés</span>
                        </label>

                        <label class="toggle-switch" title="L'événement doit être entièrement inclus dans la période">
                            <input type="checkbox" id="toggle-exclusive">
                            <span class="slider"></span>
                            <span class="label-text">Dates exactes</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div id="eventsGrid" class="events-grid">
            <!-- Events will be injected here -->
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Tous droits réservés. Par <a href="https://javed.fr" target="_blank"
                    style="text-decoration: underline;">Jawed</a></p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('eventsGrid');

            // Filters Elements
            const pickerWrapper = document.getElementById('date-picker-wrapper');
            const dStart = document.getElementById('date-start');
            const dEnd = document.getElementById('date-end');

            // Search Elements
            const searchInput = document.getElementById('tag-search');
            const suggestionsBox = document.getElementById('autocomplete-list');
            const activeTagsContainer = document.getElementById('active-search-tags');

            // Initialize Data
            const data = await eventManager.init();

            const renderEvents = (events) => {
                grid.innerHTML = '';
                if (events.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:var(--text-light);">Aucun événement trouvé.</p>';
                    return;
                }

                events.forEach(evt => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    // Tags HTML
                    const tagsHtml = evt.tags ? evt.tags.slice(0, 3).map(tag => `<span class="tag">${tag}</span>`).join('') : '';

                    // Image Source
                    const imgSrc = evt.image_locale || evt.image_url;

                    card.innerHTML = `
                        <img src="${imgSrc}" alt="${evt.titre}" class="card-image" onerror="this.style.display='none'">
                        <div class="card-content">
                            <div class="card-tags">
                                ${tagsHtml}
                            </div>
                            <h3 class="card-title">${evt.titre}</h3>
                            <div class="card-date">
                                📅 ${evt.date}
                            </div>
                            <div class="card-location">
                                📍 ${evt.lieu}
                            </div>
                            <a href="${evt.lien}" target="_blank" style="display:inline-block; margin-top:1rem; font-weight:600; color:var(--primary);">Voir plus &rarr;</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            };

            // Initial Render
            const refreshList = () => {
                const filtered = eventManager.getFilteredEvents();
                renderEvents(filtered);
            };

            refreshList();

            // Set dynamic month labels
            const { current, next } = eventManager.getMonthNames();
            document.getElementById('btn-month').textContent = `Ce mois : ${current}`;
            document.getElementById('btn-next-month').textContent = `Mois prochain : ${next}`;

            // Search Logic (Harmonized with Map)
            const renderSearchTag = (val) => {
                activeTagsContainer.innerHTML = '';
                if (val) {
                    const tagEl = document.createElement('div');
                    tagEl.className = 'search-tag';
                    tagEl.innerHTML = `${val} <span class="remove-tag">x</span>`;
                    tagEl.querySelector('.remove-tag').addEventListener('click', () => {
                        eventManager.setTagFilter(null);
                        searchInput.value = '';
                        renderSearchTag(null);
                        refreshList();
                    });
                    activeTagsContainer.appendChild(tagEl);
                    searchInput.value = '';
                    searchInput.placeholder = 'Recherche active...';
                } else {
                    searchInput.placeholder = 'Rechercher un événement, lieu, tag...';
                }
            };

            const applySearch = (val) => {
                eventManager.setTagFilter(val);
                suggestionsBox.style.display = 'none';
                renderSearchTag(val);
                refreshList();
            };

            searchInput.addEventListener('input', (e) => {
                const val = e.target.value;
                if (!val) {
                    suggestionsBox.style.display = 'none';
                    return;
                }

                const matches = eventManager.getSuggestionsMatching(val);
                if (matches.length > 0) {
                    suggestionsBox.innerHTML = '';
                    matches.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'autocomplete-suggestion';
                        div.innerHTML = `<span style="font-size:0.8em; color:#999; margin-right:5px;">[${item.type}]</span> ${item.value}`;
                        div.addEventListener('click', () => applySearch(item.value));
                        suggestionsBox.appendChild(div);
                    });
                    suggestionsBox.style.display = 'block';
                } else {
                    suggestionsBox.style.display = 'none';
                }
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const val = searchInput.value.trim();
                    if (val) {
                        applySearch(val);
                    } else {
                        eventManager.setTagFilter(null);
                        renderSearchTag(null);
                        refreshList();
                    }
                }
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-container')) {
                    suggestionsBox.style.display = 'none';
                }
            });

            // Filter Handlers
            // 1. Buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');

                    const period = e.target.dataset.period;

                    if (period === 'custom') {
                        pickerWrapper.style.opacity = '1';
                        pickerWrapper.style.pointerEvents = 'auto';
                        if (dStart.value && dEnd.value) {
                            eventManager.setCustomDates(dStart.value, dEnd.value);
                        } else {
                            eventManager.setFilterPeriod('custom');
                        }
                    } else {
                        pickerWrapper.style.opacity = '0.5';
                        pickerWrapper.style.pointerEvents = 'none';
                        eventManager.setFilterPeriod(period);
                    }

                    refreshList();
                });
            });

            // 2. Toggles
            document.getElementById('toggle-past').addEventListener('change', (e) => {
                eventManager.setIncludePast(e.target.checked);
                refreshList();
            });

            document.getElementById('toggle-exclusive').addEventListener('change', (e) => {
                eventManager.setExclusiveMode(e.target.checked);
                refreshList();
            });

            // 3. Date Inputs
            const handleDateChange = () => {
                if (dStart.value && dEnd.value) {
                    eventManager.setCustomDates(dStart.value, dEnd.value);
                    refreshList();
                }
            };

            dStart.addEventListener('change', handleDateChange);
            dEnd.addEventListener('change', handleDateChange);

            // Collapse Logic
            const collapseBtn = document.getElementById('collapse-btn');
            const filtersWrapper = document.getElementById('filters-wrapper');

            collapseBtn.addEventListener('click', () => {
                filtersWrapper.classList.toggle('filters-collapsed');
                if (filtersWrapper.classList.contains('filters-collapsed')) {
                    collapseBtn.textContent = '+';
                } else {
                    collapseBtn.textContent = '-';
                }
            });
        });
    </script>
</body>

</html>
